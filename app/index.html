<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Position desk</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2220%22%20fill%3D%22%23a77c2d%22%2F%3E%3Cpath%20d%3D%22m32%2010%206.8%2013.8%2015.2%202.2-11%2010.7%202.6%2015.1L32%2044.7l-13.6%207.1L21%2036.7%2010%2026l15.2-2.2Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>Position desk<span>.</span></h1></div><div class="export-actions"><a class="export" href="/api/export/applications.xlsx" id="export-applications">Export applications</a> <a class="export" href="#" id="export">JSON ↗</a></div></header>
<section class="overview" aria-label="Overview"><div><strong id="total">—</strong><span>positions collected</span></div><div><strong id="strong">—</strong><span>fit 4–5 · provisional included</span></div><div><strong id="shortlist">—</strong><span>shortlisted</span></div><div><strong id="active">—</strong><span>applications in progress</span></div></section>
<section class="toolbar" aria-label="Search and quick filters"><div class="search-control"><input id="search" type="search" placeholder="Search companies, titles, assessments…" aria-label="Search positions"><button type="button" id="search-clear" aria-label="Clear search" title="Clear search" hidden><span aria-hidden="true">×</span></button></div><button type="button" id="shortlist-filter" title="Show shortlisted positions" aria-pressed="false">Shortlisted</button><span class="found-since-controls"><label for="since">Found since</label><button type="button" id="since-today" title="Found since today (Europe/Berlin)">Today</button><input type="date" id="since"></span><label class="colour-control">Colour <select id="colour"><option value="both">Fit + group</option><option value="fit">Fit</option><option value="group">Group</option><option value="none">None</option></select></label><details class="columns"><summary>Columns</summary><div id="columns"></div></details><button id="reset">Reset</button><span id="count" class="result-count" role="status">Loading positions…</span></section>
<div id="message" role="alert"></div><div class="table-wrap"><table><colgroup id="colgroup"></colgroup><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><footer><span>Fit is an assessment, not a probability. ◌ = title-only assessment.</span><span id="imported"></span></footer><div id="column-filter" class="filter-panel" role="dialog" aria-label="Column filter" hidden></div></main><script src="app.js" type="module"></script></body></html>
