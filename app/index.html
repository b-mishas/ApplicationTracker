<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application tracker</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2220%22%20fill%3D%22%23a77c2d%22%2F%3E%3Cpath%20d%3D%22m32%2010%206.8%2013.8%2015.2%202.2-11%2010.7%202.6%2015.1L32%2044.7l-13.6%207.1L21%2036.7%2010%2026l15.2-2.2Z%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><div><h1>Application tracker<span>.</span></h1></div><div class="export-actions">
<div class="undo-control">
 <span id="undo-result" role="status"></span>
 <button type="button" id="undo-edit" class="export" title="Undo the last saved position edit" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-5 5 5 5M4 10h10a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
</div>
<div class="application-export" role="group" aria-labelledby="application-export-label">
 <span id="application-export-label">Export applications as</span>
 <a class="export" href="/api/export/applications.xlsx" id="export-applications">Excel</a>
 <a class="export" href="/export/applications/print" target="_blank" rel="noopener" id="export-applications-pdf">PDF</a>
</div> <a class="export" href="#" id="export" title="Export position database as JSON" aria-label="Export position database as JSON">JSON ↗</a>
<button type="button" id="settings-open" class="export">Settings</button></div></header>
<section class="overview" aria-label="Overview"><button type="button" data-status-preset="All" aria-pressed="false" title="Show all positions"><strong id="total">—</strong><span>positions collected</span></button><button type="button" data-status-preset="In progress" aria-pressed="false" title="Show Applied, Interview and Offer"><strong id="active">—</strong><span>applications in progress</span></button><button type="button" data-status-preset="Shortlisted" aria-pressed="false" title="Show shortlisted positions"><strong id="shortlist">—</strong><span>shortlisted</span></button><button type="button" data-status-preset="Urgent" aria-pressed="false" title="Show urgent positions"><strong id="urgent">—</strong><span>Urgent</span></button><button type="button" data-status-preset="New" aria-pressed="false" title="Show new positions"><strong id="new-count">—</strong><span>New</span></button></section>
<section class="toolbar" aria-label="Search and quick filters"><div class="search-control"><input id="search" type="search" maxlength="2000" placeholder="Search companies, titles, assessments…" aria-label="Search positions"><button type="button" id="search-clear" aria-label="Clear search" title="Clear search" hidden><span aria-hidden="true">×</span></button></div><div id="status-presets" class="status-presets" role="group" aria-label="Quick position filters"><button type="button" data-status-preset="New" aria-pressed="false" title="Show new positions">New</button><button type="button" data-status-preset="Shortlisted" aria-pressed="false" title="Show shortlisted positions">Shortlisted</button><button type="button" data-status-preset="In progress" aria-pressed="false" title="Show Applied, Interview and Offer">In progress</button><button type="button" data-status-preset="All" aria-pressed="false" title="Show positions in every status">All</button></div><span id="count" class="result-count" role="status">Loading positions…</span><div class="toolbar-actions"><button id="reset">Reset</button><details class="columns"><summary>Columns</summary><div id="columns"></div></details></div></section>
<div id="message" role="alert"></div><div class="table-wrap"><table><colgroup id="colgroup"></colgroup><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><footer><span>Fit is an assessment, not a probability. ◌ = title-only assessment.</span><span id="imported"></span></footer><div id="column-filter" class="filter-panel" role="dialog" aria-label="Column filter" hidden></div></main><dialog id="settings-dialog"><form id="settings-form"><h2>Settings</h2><label>Name<input type="text" id="settings-name" autocomplete="name" maxlength="100"></label><label>Excel language (for export)<select id="settings-language"><option value="en">English</option><option value="de">Deutsch</option></select></label><p id="settings-result" role="alert"></p><div class="settings-actions"><button type="button" id="settings-cancel">Cancel</button><button id="settings-save">Save settings</button></div></form></dialog><script src="app.js" type="module"></script></body></html>
